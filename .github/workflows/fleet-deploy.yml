name: Deploy Fleet Worker

on:
  push:
    branches: [main]
    paths:
      - "fleet/**"
      - "templates/**"
      - "app.py"
      - "version.json"
      - "scripts/panel-update.sh"
      - "proxy_pool.py"
      - "xray_client.py"
      - "requirements.txt"
      - ".github/workflows/fleet-deploy.yml"
  workflow_dispatch:

concurrency:
  group: fleet-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  changes:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      fleet: ${{ steps.filter.outputs.fleet }}
      panel: ${{ steps.filter.outputs.panel }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            fleet:
              - 'fleet/**'
              - '.github/workflows/fleet-deploy.yml'
            panel:
              - 'templates/**'
              - 'app.py'
              - 'version.json'
              - 'scripts/panel-update.sh'
              - 'proxy_pool.py'
              - 'xray_client.py'
              - 'requirements.txt'

  fleet:
    needs: changes
    if: needs.changes.outputs.fleet == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fleet/package-lock.json

      - name: Install dependencies
        working-directory: fleet
        run: npm ci

      - name: Resolve KV namespace ID
        id: kv
        working-directory: fleet
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          kv_id_from_file() {
            grep -m1 '"id"' wrangler.jsonc | sed 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/'
          }
          if grep -q 'REPLACE_WITH_KV_NAMESPACE_ID' wrangler.jsonc; then
            KV_ID="$(npx wrangler kv namespace list --json | jq -r '.[] | select(.title=="KV") | .id' | head -1)"
            if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
              echo "Could not find KV namespace titled 'KV'. Run: npx wrangler kv namespace list"
              exit 1
            fi
            sed -i "s/REPLACE_WITH_KV_NAMESPACE_ID/${KV_ID}/g" wrangler.jsonc
            cd ..
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add fleet/wrangler.jsonc
            if ! git diff --staged --quiet; then
              git commit -m "chore: set KV namespace ID in wrangler.jsonc [skip ci]"
              git push
            fi
            cd fleet
          else
            KV_ID="$(kv_id_from_file)"
          fi
          echo "id=${KV_ID}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Workers
        working-directory: fleet
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Sync Fleet UI to KV
        working-directory: fleet
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          KV_ID="${{ steps.kv.outputs.id }}"
          npx wrangler kv key put fleet_ui_version --value="$(jq -c . version.json)" --namespace-id="$KV_ID" --remote
          npx wrangler kv key put fleet_ui_html --path=public/index.html --namespace-id="$KV_ID" --remote

      - name: Deployment summary
        run: |
          echo "### Fleet deployed + UI synced to KV" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fleet UI updates automatically — no manual **Update fleet UI** needed." >> "$GITHUB_STEP_SUMMARY"

  panels:
    needs: changes
    if: needs.changes.outputs.panel == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Update all AgentControl panels via Fleet
        env:
          FLEET_PASSWORD: ${{ secrets.FLEET_PASSWORD }}
          FLEET_URL: ${{ vars.FLEET_URL }}
        run: |
          if [ -z "${FLEET_URL:-}" ]; then
            echo "FLEET_URL repository variable not set — skipping panel rollout."
            echo "Set Settings → Variables → Actions → FLEET_URL to enable automatic panel updates."
            exit 0
          fi
          if [ -z "${FLEET_PASSWORD:-}" ]; then
            echo "FLEET_PASSWORD secret not set — skipping panel rollout."
            echo "Set the same password you chose in Fleet setup as a GitHub secret."
            exit 0
          fi
          curl -sfS -X POST "${FLEET_URL%/}/api/fleet/update-all" \
            -H "X-Fleet-Password: ${FLEET_PASSWORD}" \
            -H "Content-Type: application/json"
          echo "Panel update triggered on all Fleet servers."
