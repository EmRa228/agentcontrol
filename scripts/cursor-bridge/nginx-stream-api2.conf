# Run on a machine outside Iran (egress IP allowed by Cursor).
# TLS passthrough: clients use CURSOR_API_ENDPOINT=https://api2.cursor.sh:18443
# with /etc/hosts: 127.0.0.1 api2.cursor.sh (when using SSH -R to this port).

stream {
    server {
        listen 127.0.0.1:18443;
        proxy_pass api2.cursor.sh:443;
        proxy_connect_timeout 30s;
        proxy_timeout 24h;
    }
}
