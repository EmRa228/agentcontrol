<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AgentControl status</title>
<style>
  :root { color-scheme: light dark; --bg:#0d1117; --card:#161b22; --text:#e6edf3; --muted:#8b949e; --ok:#3fb950; --warn:#d29922; --crit:#f85149; --border:#30363d; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f8fa; --card:#fff; --text:#1f2328; --muted:#59636e; --border:#d0d7de; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:720px; margin:0 auto; }
  h1 { font-size:1.35rem; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:.85rem; margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:18px; margin-bottom:14px; }
  .status { display:flex; align-items:center; gap:10px; font-size:1.1rem; font-weight:600; }
  .dot { width:12px; height:12px; border-radius:50%; background:var(--ok); }
  .dot.warning { background:var(--warn); } .dot.critical { background:var(--crit); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-top:16px; }
  .metric { border:1px solid var(--border); border-radius:8px; padding:10px 12px; }
  .metric b { display:block; font-size:1.1rem; }
  .metric span { color:var(--muted); font-size:.75rem; }
  ul.checks { list-style:none; padding:0; margin:16px 0 0; }
  ul.checks li { display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-top:1px solid var(--border); font-size:.85rem; }
  .badge { font-size:.7rem; padding:1px 8px; border-radius:999px; border:1px solid var(--border); color:var(--muted); }
  .badge.warning { color:var(--warn); border-color:var(--warn); } .badge.critical { color:var(--crit); border-color:var(--crit); }
  .footer { color:var(--muted); font-size:.75rem; text-align:center; margin-top:20px; }
  a { color:inherit; }
</style>
</head>
<body>
<div class="wrap">
  <h1>AgentControl status</h1>
  <p class="sub" id="sub">Loading…</p>

  <div class="card">
    <div class="status"><span class="dot" id="dot"></span><span id="status-text">Checking…</span></div>
    <div class="grid">
      <div class="metric"><b id="workers">—</b><span>Workers running</span></div>
      <div class="metric"><b id="uptime">—</b><span>Panel uptime</span></div>
      <div class="metric"><b id="disk">—</b><span>Disk used</span></div>
      <div class="metric"><b id="cert">—</b><span>TLS certificate</span></div>
    </div>
    <ul class="checks" id="checks"></ul>
  </div>

  <p class="footer">Version <span id="version">{{ version.version }}</span> · updates automatically · <a href="/">Sign in</a></p>
</div>
<script nonce="{{ csp_nonce }}">
  const fmtUptime = (s) => {
    if (s == null) return '—';
    const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
    return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
  };
  async function refresh() {
    try {
      const res = await fetch('/api/public/status', { cache: 'no-store' });
      if (!res.ok) throw new Error('status ' + res.status);
      const data = await res.json();
      const dot = document.getElementById('dot');
      dot.className = 'dot ' + (data.status || '');
      document.getElementById('status-text').textContent =
        data.status === 'ok' ? 'All systems operational' : data.status === 'warning' ? 'Degraded performance' : 'Service issue';
      document.getElementById('workers').textContent = `${data.workers_running ?? 0}/${data.workers_total ?? 0}`;
      document.getElementById('uptime').textContent = fmtUptime(data.uptime_seconds);
      document.getElementById('disk').textContent = data.disk?.percent != null ? data.disk.percent + '%' : '—';
      const days = data.certificate?.days_left;
      document.getElementById('cert').textContent = days == null ? '—' : Math.max(0, Math.round(days)) + 'd';
      document.getElementById('checks').innerHTML = (data.checks || []).map((check) => `
        <li><span>${check.message}</span><span class="badge ${check.status}">${check.status}</span></li>`).join('');
      document.getElementById('version').textContent = data.version || '';
      document.getElementById('sub').textContent = 'Last checked ' + new Date(data.checked_at).toLocaleString();
    } catch (err) {
      document.getElementById('dot').className = 'dot critical';
      document.getElementById('status-text').textContent = 'Status unavailable';
      document.getElementById('sub').textContent = 'Retrying…';
    }
  }
  refresh();
  setInterval(refresh, 15000);
</script>
</body>
</html>
